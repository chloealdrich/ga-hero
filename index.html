<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Evolution of Sustainability Reporting</title>
<!-- Runda, from G&A's Adobe Fonts web project -->
<link rel="stylesheet" href="https://use.typekit.net/htc2apy.css">
<link rel="stylesheet" href="hero.css">
<link rel="stylesheet" href="sector.css">
<link rel="stylesheet" href="nav.css">
<link rel="stylesheet" href="drill.css">
<link rel="stylesheet" href="frameworks.css">
<link rel="stylesheet" href="segmented.css">
</head>
<body>

<div class="hero-scroll" id="hero" data-hero data-page="overview" data-title="The Evolution of Sustainability Reporting">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__stage" data-stage>

      <nav class="site-nav" aria-label="Sections">
        <a href="#overview">Overview</a>
        <a href="#sector">Sector</a>
        <!-- TODO: point at the Initiative section once it exists. -->
        <a href="#initiative">Initiative</a>
      </nav>

      <figure class="hero__chart" role="img" aria-label="Timeline chart loading." data-chart>
        <svg width="1440" height="900" viewBox="0 0 1440 900" aria-hidden="true">
          <g data-layer="grid"></g>
          <g data-layer="band"></g>
          <g data-layer="playhead"></g>
          <g data-layer="connector"></g>
          <g data-layer="stalks"></g>
          <g data-layer="series"></g>
          <g data-layer="hits" class="hero__hits"></g>
        </svg>
      </figure>

      <img class="hero__logo" src="assets/G%26A-Logo_fullname-color.svg" alt="Governance &amp; Accountability Institute, Inc.">

      <h1 class="hero__title" id="hero-title">The Evolution of Sustainability Reporting</h1>

      <div class="hero__callout" aria-live="polite">
        <div class="hero__callout-year" data-callout-year></div>
        <p class="hero__callout-blurb" data-callout-blurb></p>
      </div>

      <div class="hero__overlay" data-overlay></div>

      <!-- hero.js points this at the next year's snap point and hides it once scrolling starts. -->
      <a class="hero__cta" href="#hero" data-cta>
        <span>Scroll To Explore</span>
        <!-- Phosphor arrow-right (Regular) -->
        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg>
      </a>

    </div>
  </section>
</div>

<section class="sector" aria-labelledby="sector-title" data-sector data-page="sector" data-title="Reporting by Sector" hidden>
  <div class="sector__stage" data-sector-stage>

    <img class="sector__logo" src="assets/G%26A-Logo_fullname-color.svg" alt="Governance &amp; Accountability Institute, Inc.">

    <nav class="site-nav" aria-label="Sections">
      <a href="#overview">Overview</a>
      <a href="#sector">Sector</a>
      <!-- TODO: point at the Initiative section once it exists. -->
      <a href="#initiative">Initiative</a>
    </nav>

    <div class="sector__intro">
      <!-- Placeholder title copy (spec known issue 3). -->
      <h2 class="sector__title" id="sector-title">Reporting by Sector, <span data-sector-year></span></h2>
      <p class="sector__summary" data-sector-summary></p>
      <p class="sector__hint">Each dot is one company. Hover a sector to see its counts, or click it to see its frameworks, SDGs and assurance.</p>
    </div>

    <fieldset class="sector__view">
      <legend>View</legend>
      <div class="sector__view-options" data-segmented>
        <label><input type="radio" name="sector-view" value="full" checked><span data-view-label="russell1000"></span></label>
        <label><input type="radio" name="sector-view" value="split">Split By Market Cap</label>
      </div>
      <div class="sector__legend" data-sector-legend></div>
    </fieldset>

    <div class="sector__split-header sector__split-header--left" data-split-header="sp500"></div>
    <div class="sector__split-header sector__split-header--right" data-split-header="smallestHalf"></div>
    <div class="sector__divider" aria-hidden="true"></div>

    <figure class="sector__chart" role="img" aria-label="Sector chart loading." data-sector-chart>
      <div class="sector__plot" aria-hidden="true" data-sector-plot></div>
    </figure>

    <!-- Focusable sector targets sit above the chart; the card describes the focused one. -->
    <div class="sector__targets" data-sector-targets></div>
    <div class="sector-card" role="tooltip" id="sector-card" data-sector-card></div>

    <!-- Plays the years from first to last (sector.js); shows pause while playing. -->
    <button class="sector__play" type="button" aria-label="Play timeline" data-sector-play>
      <!-- Phosphor play / pause (Fill) -->
      <svg class="sector__play-icon sector__play-icon--play" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></svg>
      <svg class="sector__play-icon sector__play-icon--pause" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"/></svg>
    </button>

    <!-- Stepped year slider: a native range input (invisible, on top) drives the
         drawn line, year dots and labels, so drag, click and keyboard all work. -->
    <div class="year-slider">
      <label class="visually-hidden" for="sector-year">Year</label>
      <input class="year-slider__input" id="sector-year" type="range" step="1" data-sector-slider>
      <div class="year-slider__rail" aria-hidden="true">
        <span class="year-slider__line"></span>
        <span class="year-slider__fill" data-slider-fill></span>
        <div data-slider-ticks></div>
        <span class="year-slider__thumb" data-slider-thumb></span>
      </div>
      <div class="year-slider__years" aria-hidden="true" data-sector-years></div>
    </div>

    <table class="visually-hidden" data-sector-table></table>
    <div class="drill" data-drill hidden></div>
  </div>
</section>

<script src="hero.js" defer></script>
<script src="segmented.js" defer></script>
<script src="sector-icons.js" defer></script>
<script src="sector.js" defer></script>
<script src="drill.js" defer></script>
<script src="frameworks.js" defer></script>
<script src="nav.js" defer></script>
</body>
</html>
